name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - run: npm ci
      - run: npm run fetch:bg-removal
      - name: Build web (native base)
        run: VITE_BASE=/ npx tsc -b && VITE_BASE=/ npx vite build
      - name: Capacitor sync
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/*.apk dist-apk/qing-yichu-debug.apk
          ls -lh dist-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: qing-yichu-debug
          path: dist-apk/qing-yichu-debug.apk
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-debug-latest"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          VER=$(node -p "require('./package.json').version")
          NOTES=$(printf 'version:%s\n\n去背景模型已内置（约 80MB）。可直接安装的 debug 包（需允许安装未知来源）。\n网页版：https://zenty-me.github.io/qing-yichu/\n版本信息：https://zenty-me.github.io/qing-yichu/app-version.json' "$VER")
          gh release create "$TAG" dist-apk/qing-yichu-debug.apk \
            --title "轻衣橱 Android Debug APK" \
            --notes "$NOTES" \
            --latest=false
