name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - run: npm ci
      - run: npm run fetch:bg-removal
      - name: Verify bg-removal model chunks
        run: |
          set -euo pipefail
          test -f public/bg-removal/resources.json
          # resources.json alone is committed; chunks must be fetched (~76MB)
          CHUNK_COUNT=$(find public/bg-removal -type f ! -name 'README.md' ! -name 'resources.json' ! -name '.gitkeep' | wc -l)
          BYTES=$(du -sb public/bg-removal | cut -f1)
          echo "bg-removal files (excl meta): $CHUNK_COUNT, bytes: $BYTES"
          test "$CHUNK_COUNT" -ge 20
          # pruned set is ~80MB; fail if under 50MB (would ship a hollow APK again)
          test "$BYTES" -ge 50000000
          # Capacitor html5mode: every chunk name must contain a '.' or Android serves index.html
          python3 - <<'PY'
          import json, sys
          res = json.load(open("public/bg-removal/resources.json"))
          for key, entry in res.items():
              for c in entry.get("chunks") or []:
                  if "." not in c["name"]:
                      sys.exit(f"extensionless chunk (Capacitor SPA trap): {key} {c['name']}")
          print("all chunk names have extensions")
          PY
          node scripts/verify-capacitor-bg-removal.mjs
          ls -lh public/bg-removal | head -30
      - name: Build web (native base)
        run: VITE_BASE=/ npx tsc -b && VITE_BASE=/ npx vite build
      - name: Capacitor sync
        run: npx cap sync android
      - name: Verify models synced into android assets
        run: |
          set -euo pipefail
          ASSET=android/app/src/main/assets/public/bg-removal
          test -d "$ASSET"
          BYTES=$(du -sb "$ASSET" | cut -f1)
          echo "android assets bg-removal bytes: $BYTES"
          test "$BYTES" -ge 50000000
          # spot-check a known model chunk hash from resources.json
          python3 - <<'PY'
          import json, os, sys
          root = "android/app/src/main/assets/public/bg-removal"
          with open(os.path.join(root, "resources.json")) as f:
              res = json.load(f)
          entry = res.get("/models/isnet_quint8")
          if not entry or not entry.get("chunks"):
              sys.exit("missing isnet_quint8 chunks in resources.json")
          name = entry["chunks"][0]["name"]
          path = os.path.join(root, name)
          if not os.path.isfile(path):
              sys.exit(f"missing chunk in android assets: {name}")
          print("ok:", name, os.path.getsize(path))
          PY
      - name: Assemble debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: |
          set -euo pipefail
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/*.apk dist-apk/closet-lite-debug.apk
          ls -lh dist-apk/
          BYTES=$(stat -c%s dist-apk/closet-lite-debug.apk)
          echo "APK bytes: $BYTES"
          # Uncompressed models ~79MB; zip-compressed APK lands ~45–50MB.
          # Old hollow build was ~4.6MB — require >> that and prove chunks are inside.
          test "$BYTES" -ge 40000000
          CHUNK_IN_APK=$(unzip -l dist-apk/closet-lite-debug.apk | grep -c 'assets/public/bg-removal/' || true)
          echo "bg-removal entries in APK: $CHUNK_IN_APK"
          test "$CHUNK_IN_APK" -ge 20
          unzip -l dist-apk/closet-lite-debug.apk | grep 'assets/public/bg-removal/' | head -10 || true
      - uses: actions/upload-artifact@v4
        with:
          name: closet-lite-debug
          path: dist-apk/closet-lite-debug.apk
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-debug-latest"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          VER=$(node -p "require('./package.json').version")
          NOTES=$(printf 'version:%s\n\nBundled bg-removal model (~80MB). Debug APK (allow unknown sources).\nWeb: https://zenty-me.github.io/closet-lite/\nVersion: https://zenty-me.github.io/closet-lite/app-version.json' "$VER")
          gh release create "$TAG" dist-apk/closet-lite-debug.apk \
            --title "Closet Lite Android Debug APK" \
            --notes "$NOTES" \
            --latest=false
