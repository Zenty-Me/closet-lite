name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - run: npm ci
      - run: npm run fetch:bg-removal
      - name: Verify bg-removal model chunks
        run: |
          set -euo pipefail
          test -f public/bg-removal/resources.json
          # resources.json alone is committed; chunks must be fetched (~76MB)
          CHUNK_COUNT=$(find public/bg-removal -type f ! -name 'README.md' ! -name 'resources.json' ! -name '.gitkeep' | wc -l)
          BYTES=$(du -sb public/bg-removal | cut -f1)
          echo "bg-removal files (excl meta): $CHUNK_COUNT, bytes: $BYTES"
          test "$CHUNK_COUNT" -ge 20
          # pruned set is ~80MB; fail if under 50MB (would ship a hollow APK again)
          test "$BYTES" -ge 50000000
          ls -lh public/bg-removal | head -30
      - name: Build web (native base)
        run: VITE_BASE=/ npx tsc -b && VITE_BASE=/ npx vite build
      - name: Capacitor sync
        run: npx cap sync android
      - name: Verify models synced into android assets
        run: |
          set -euo pipefail
          ASSET=android/app/src/main/assets/public/bg-removal
          test -d "$ASSET"
          BYTES=$(du -sb "$ASSET" | cut -f1)
          echo "android assets bg-removal bytes: $BYTES"
          test "$BYTES" -ge 50000000
          # spot-check a known model chunk hash from resources.json
          python3 - <<'PY'
          import json, os, sys
          root = "android/app/src/main/assets/public/bg-removal"
          with open(os.path.join(root, "resources.json")) as f:
              res = json.load(f)
          entry = res.get("/models/isnet_quint8")
          if not entry or not entry.get("chunks"):
              sys.exit("missing isnet_quint8 chunks in resources.json")
          name = entry["chunks"][0]["name"]
          path = os.path.join(root, name)
          if not os.path.isfile(path):
              sys.exit(f"missing chunk in android assets: {name}")
          print("ok:", name, os.path.getsize(path))
          PY
      - name: Assemble debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/*.apk dist-apk/qing-yichu-debug.apk
          ls -lh dist-apk/
          BYTES=$(stat -c%s dist-apk/qing-yichu-debug.apk)
          echo "APK bytes: $BYTES"
          # models alone ~76MB; APK should be well over 50MB once packaged
          test "$BYTES" -ge 50000000
      - uses: actions/upload-artifact@v4
        with:
          name: qing-yichu-debug
          path: dist-apk/qing-yichu-debug.apk
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-debug-latest"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          VER=$(node -p "require('./package.json').version")
          NOTES=$(printf 'version:%s\n\n去背景模型已内置（约 80MB）。可直接安装的 debug 包（需允许安装未知来源）。\n网页版：https://zenty-me.github.io/qing-yichu/\n版本信息：https://zenty-me.github.io/qing-yichu/app-version.json' "$VER")
          gh release create "$TAG" dist-apk/qing-yichu-debug.apk \
            --title "轻衣橱 Android Debug APK" \
            --notes "$NOTES" \
            --latest=false
